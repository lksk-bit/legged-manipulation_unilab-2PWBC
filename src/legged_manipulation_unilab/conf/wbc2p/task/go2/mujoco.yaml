# @package _global_
defaults:
  - /task/go2/rewards
  - _self_

training:
  task_name: Go2ArmManipLoco
  sim_backend: mujoco
env:
  # Reference RoboDuet: 200 Hz physics / 50 Hz policy (4 substeps).
  sim_dt: 0.005
  ctrl_dt: 0.02
  history:
    # RoboDuet Unified2ActorCritic consumes 15 one-step frames.
    num_actor_history: 15
    num_critic_history: 15
  goal_ee:
    sphere_l_range:
    - 0.3
    - 0.77
    sphere_phi_range:
    - -1.4137
    - 1.4137
    sphere_theta_range:
    - -1.5708
    - 1.5708
    traj_time_range:
    - 2.0
    - 3.0
    hold_time_range:
    - 0.5
    - 2.0
    collision_upper_limits:
    - 0.3
    - 0.15
    - -0.115
    collision_lower_limits:
    - -0.2
    - -0.15
    - -0.515
    underground_limit: -0.57
    num_collision_check_samples: 10
    num_resample_attempts: 10
    default_orn_roll: 0.0
    arm_induced_pitch: 0.0
    delta_orn_r:
    - -1.4137
    - 1.4137
    delta_orn_p:
    - -1.0472
    - 1.0472
    delta_orn_y:
    - -1.3090
    - 1.3090
    init_ee_cart:
    - 0.25
    - 0.0
    - 0.25
  control_config:
    # Reference leg PD is 35/1 (vendor/roboduet/go1_gym/envs/go1/asset_config.py).
    # These gains are given to the UniLab backend at environment creation.
    leg_kp: 40.0
    leg_kd: 1.0
    # Low-pass raw leg target only when the commanded body velocity is zero.
    # This also affects existing checkpoints during play, without retraining.
    stand_action_smoothing: 0.75
    # RoboDuet cooperative policy: the six arm outputs are joint-position
    # residuals around the XML default pose.  Do not route them through IK.
    arm_action_mode: raw
    arm_action_scale: 0.25
    hip_action_scale_reduction: 0.5
    clip_actions: 100.0
  ik:
    damping: 0.05
    gain: 1.0
    dq_clip: 0.2
    use_orientation: true
    orientation_mode: target
  command_config:
    vel_limit:
    - - -0.6
      - -0.4
      - -0.8
    - - 1.0
      - 0.4
      - 0.8
    zero_command_prob: 0.15
    resample_time_s: 10.0
    gait_frequency: 3.0
  curriculum_config:
    enable: false
  domain_rand:
    randomize_base_mass: false
    added_mass_range:
    - -1.0
    - 1.0
    randomize_body_mass: true
    body_mass_multiplier_range:
    - 0.9
    - 1.1
    random_com: true
    com_offset_x:
    - -0.03
    - 0.03
    randomize_gravity: false
    randomize_ground_friction: true
    ground_friction_multiplier_range:
    - 0.8
    - 1.2
    randomize_dof_armature: true
    dof_armature_multiplier_range:
    - 0.8
    - 1.2
    push_robots: true
    push_interval: 500
    max_force:
    - 1.2
    - 1.2
    - 0.6
    push_body_name: base
    randomize_kp: true
    kp_multiplier_range:
    - 0.9
    - 1.1
    randomize_kd: true
    kd_multiplier_range:
    - 0.9
    - 1.1
  arm_stage:
    # Full cooperative (stage-2) policy. Stage-1 locomotion pretraining is
    # selected with the command-line overrides in migration/README.md.
    freeze_arm_joints: false
    disable_ee_goal_trajectory: false
    fixed_ee_goal_cart:
    - 0.15
    - 0.0
    - 0.25
  wbc_switch:
    start_steps: 0
    use_unified_observation: true
    # unified_train.py sets pretrained_to_hybrid_end equal to start: the
    # reference switches rewards and cross-head beta in one update.
    duration_steps: 0
